<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover: lets the page know the size of the iPhone's home-bar /
      notch area (env(safe-area-inset-*)), so the bottom bar can sit above it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F3" />
    <title>%WEB_TITLE%</title>
    <!-- Expo's react-native-web style reset, plus iPhone Safari fixes (see below). -->
    <style id="expo-reset">
      /* Full-height page. 100dvh = the height you can actually SEE, which on
         iPhone Safari changes as its toolbars show/hide. Plain 100% / 100vh is
         the tallest size, so the bottom of the app ended up under Safari's
         toolbar and the home bar. Older browsers keep the 100% line. */
      html,
      body {
        height: 100%;
        height: 100dvh;
        background-color: #f7f7f3;
      }
      /* No body scrolling (screens scroll inside) and no rubber-band bounce. */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
